<!doctype html>
<html lang="en" class="i18n-pending">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <title>Split Search</title>
  <link rel="stylesheet" href="../styles/tokens.css">
  <link rel="stylesheet" href="../styles/panes.css">
  <link rel="stylesheet" href="popup.css">
  <script type="module" src="popup.js"></script>
</head>
<body>
  <main class="loading">
    <h1 class="brand">Split Search</h1>

    <!-- 不是本扩展的分屏，或读取失败；#idle 按设置进度分三档（lib/popup-view.js 的 idleView，data-tier 记档位）：
         setup 只留“还没设置好”和“完成设置”；try、ready 补一句怎么试和当前默认组合（读不到配置时不显示组合），try 再加去第 2 步的入口 -->
    <p id="not-ours" class="muted" data-i18n="popup_not_ours" hidden></p>
    <div id="idle" hidden>
      <div id="idle-setup" hidden>
        <p data-i18n="popup_setup_needed"></p>
        <button id="idle-setup-open" class="btn btn-primary" type="button" data-i18n="popup_setup_button"></button>
      </div>
      <p id="idle-try" class="muted" data-i18n="popup_idle_hint"></p>
      <p id="idle-setup-note" class="muted" hidden>
        <span data-i18n="popup_setup_try_note"></span>
        <button id="idle-setup-link" class="link-btn" type="button" data-i18n="popup_setup_link"></button>
      </p>
      <div id="idle-pair" hidden>
        <h2 id="idle-pair-title" data-i18n="options_pair_title"></h2>
        <div id="idle-panes"></div>
      </div>
    </div>

    <!-- 本扩展的一对 -->
    <section id="pair" hidden>
      <dl class="facts">
        <dt id="query-label" data-i18n="popup_query_label"></dt>
        <dd id="query"></dd>
      </dl>
      <!-- 左右两格镜像工具栏图标，由 ui/panes.js 建（idle.js）；查询对的行标签换成“网页”“查询” -->
      <div id="pair-panes"></div>
      <h2 id="choices-title" data-i18n="popup_switch_title"></h2>
      <ul id="choices" class="choices" aria-labelledby="choices-title"></ul>
      <p id="no-choices" class="muted" data-i18n="popup_no_choices" hidden></p>
    </section>

    <!-- 补成分屏：当前标签是已配置引擎的结果页、不在分屏中 -->
    <section id="complete" hidden>
      <p id="complete-detected" class="detected"></p>
      <h2 id="complete-title" data-i18n="popup_complete_hint"></h2>
      <ul id="complete-choices" class="choices" aria-labelledby="complete-title"></ul>
    </section>

    <!-- 补成之后的提示（窄窗口开在旁边、没能组成拆分视图）；补成后弹窗换成对视图，提示仍留着 -->
    <p id="complete-note" class="muted note" role="status" hidden></p>

    <p id="error" class="error" role="alert" hidden></p>

    <footer>
      <!-- 快捷键 cycle-right：已绑定显示组合键，未绑定显示“设置快捷键”（打开 chrome://extensions/shortcuts） -->
      <div id="shortcut" class="shortcut"></div>
      <button id="open-options" class="btn" type="button" data-i18n="common_open_options"></button>
    </footer>
  </main>
</body>
</html>
