<!doctype html>
<html lang="en" class="i18n-pending">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Split Search</title>
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="go.css">
  <script type="module" src="go.js"></script>
</head>
<body>
  <main>
    <img class="logo" src="icons/icon-48.png" alt="" width="40" height="40">
    <p id="status" role="status" data-i18n="go_status_opening"></p>
    <div id="error" role="alert" hidden>
      <p id="error-message"></p>
    </div>
    <div class="actions">
      <button id="rerun" class="primary" type="button" data-i18n="go_btn_rerun" hidden></button>
      <button id="left-only" class="primary" type="button" data-i18n="go_btn_left_only" hidden></button>
      <button id="open-options" type="button" data-i18n="common_open_options" hidden></button>
    </div>
  </main>
</body>
</html>
