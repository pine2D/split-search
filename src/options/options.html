<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title data-i18n="options_title">Split Search</title>
  <link rel="stylesheet" href="../styles/tokens.css">
  <link rel="stylesheet" href="../styles/panes.css">
  <link rel="stylesheet" href="options.css">
  <script type="module" src="options.js"></script>
</head>
<body class="loading">
  <div class="page">
    <header class="page-head">
      <div class="page-title">
        <h1 data-i18n="options_title">Split Search</h1>
        <p class="muted" data-i18n="options_tagline"></p>
      </div>
      <div class="lang-box">
        <div id="lang-picker"></div>
      </div>
    </header>

    <!-- 四个 tab（tabs.js）：静态时都不选中、面板都 hidden，首次渲染的 routeOnce 选中一个；tab 状态只在网址 hash（#tab-<key>）里 -->
    <div class="tabbar">
      <div role="tablist" id="tabs" class="tablist" data-i18n-attr="aria-label:options_tabs_label">
        <button type="button" role="tab" class="tab" id="tabbtn-add" aria-controls="panel-add" aria-selected="false" tabindex="-1">
          <span id="tabname-add" data-i18n="options_tab_add"></span>
          <span class="tab-flag" id="tab-flag-add"></span>
        </button>
        <button type="button" role="tab" class="tab" id="tabbtn-pair" aria-controls="panel-pair" aria-selected="false" tabindex="-1">
          <span id="tabname-pair" data-i18n="options_tab_pair"></span>
        </button>
        <button type="button" role="tab" class="tab" id="tabbtn-engines" aria-controls="panel-engines" aria-selected="false" tabindex="-1">
          <span id="tabname-engines" data-i18n="options_tab_engines"></span>
        </button>
        <button type="button" role="tab" class="tab" id="tabbtn-lookup" aria-controls="panel-lookup" aria-selected="false" tabindex="-1">
          <span id="tabname-lookup" data-i18n="options_tab_lookup"></span>
        </button>
      </div>
    </div>

    <main>
      <div role="tabpanel" id="panel-add" aria-labelledby="tabname-add" tabindex="0" hidden>
        <section id="setup" class="card setup" role="region" aria-labelledby="setup-title" hidden></section>
        <section id="guide" class="card" aria-labelledby="guide-title">
          <h2 id="guide-title" data-i18n="options_guide_title"></h2>
          <div id="triggers" class="triggers"></div>
          <!-- 5 步说明：“开始使用”卡显示时由 guide.js 收进默认收起的 <details>（renderGuideSteps），不显示时照常展开 -->
          <div id="guide-steps">
          <h3 id="guide-steps-title" tabindex="-1" data-i18n="guide_steps_title"></h3>
          <ol class="steps">
            <li>
              <span data-i18n="guide_step_open_settings"></span>
              <span class="url-line"><code class="url-box mono">chrome://settings/<wbr>searchEngines</code><span id="settings-url-copy"></span></span>
            </li>
            <li data-i18n="guide_step_add"></li>
            <li id="guide-step-fields"></li>
            <li data-i18n="guide_step_default"></li>
            <li data-i18n="guide_step_grant"></li>
          </ol>
          </div>
          <details class="disclosure">
            <summary><span data-i18n="guide_caveats_title"></span></summary>
          <ul class="caveats">
            <li data-i18n="guide_caveat_degrade"></li>
            <li data-i18n="guide_caveat_no_suggest"></li>
            <li data-i18n="guide_caveat_context_menu"></li>
            <li data-i18n="guide_caveat_sync"></li>
            <li data-i18n="guide_caveat_template_change"></li>
            <li data-i18n="guide_caveat_remove"></li>
          </ul>
          </details>
        </section>
      </div>
      <div role="tabpanel" id="panel-pair" aria-labelledby="tabname-pair" tabindex="0" hidden>
        <section class="card" aria-labelledby="pair-title">
          <h2 id="pair-title" data-i18n="options_pair_title"></h2>
          <p class="hint" data-i18n="options_pair_hint"></p>
          <div id="pair-body"></div>
        </section>
      </div>
      <div role="tabpanel" id="panel-engines" aria-labelledby="tabname-engines" tabindex="0" hidden>
        <section class="card" aria-labelledby="engines-title">
          <div class="section-head">
            <h2 id="engines-title" data-i18n="options_engines_title"></h2>
            <div class="section-actions">
              <button type="button" id="engines-reorder" class="btn btn-small" aria-controls="engines" data-i18n="engine_reorder"></button>
              <button type="button" id="catalog-open" class="btn btn-small" data-i18n="options_add_from_catalog"></button>
              <button type="button" id="add-engine" class="btn btn-primary btn-small" data-i18n="options_add_engine"></button>
            </div>
          </div>
          <p id="engines-hint" class="hint" data-i18n="options_engines_hint"></p>
          <!-- “调整顺序”模式（reorder.js）的说明与播报：在 #engines 之外，列表重建时不会被清掉 -->
          <p id="engines-reorder-hint" class="hint" hidden data-i18n="engine_reorder_hint"></p>
          <p id="engines-status" class="sr-only" role="status"></p>
          <div id="engines"></div>
          <!-- 没有隐藏的引擎时小标题和列表都 hidden（options.js） -->
          <h3 id="hidden-title" data-i18n="options_hidden_title"></h3>
          <div id="hidden-engines"></div>
        </section>
        <section class="card" aria-labelledby="shortcut-title">
          <h2 id="shortcut-title" data-i18n="options_shortcut_title"></h2>
          <p class="hint" data-i18n="options_shortcut_hint"></p>
          <div id="shortcut"></div>
          <!-- 参与轮换的引擎清单（shortcut.js 的 renderCycleList）：在 #shortcut 之外，重画快捷键一行时不会冲掉它 -->
          <div id="cycle"></div>
        </section>
      </div>
      <div role="tabpanel" id="panel-lookup" aria-labelledby="tabname-lookup" tabindex="0" hidden>
        <section class="card" aria-labelledby="lookup-title">
          <h2 id="lookup-title" data-i18n="options_lookup_title"></h2>
          <div id="lookup-body"></div>
        </section>
      </div>
    </main>

    <footer class="page-foot">
      <p class="hint" data-i18n="lang_note"></p>
    </footer>
  </div>

  <div id="notices" class="notices" aria-live="polite"></div>

  <dialog id="catalog-dialog" aria-labelledby="catalog-title" tabindex="-1">
    <h2 id="catalog-title" data-i18n="catalog_title"></h2>
    <p class="hint" data-i18n="catalog_hint"></p>
    <div id="catalog-body"></div>
    <div class="dialog-actions">
      <button type="button" id="catalog-close" class="btn" data-i18n="common_close"></button>
    </div>
  </dialog>

  <dialog id="image-catalog-dialog" aria-labelledby="image-catalog-title" tabindex="-1">
    <h2 id="image-catalog-title" data-i18n="catalog_image_title"></h2>
    <p class="hint" data-i18n="catalog_image_hint"></p>
    <div id="image-catalog-body"></div>
    <div class="dialog-actions">
      <button type="button" id="image-catalog-close" class="btn" data-i18n="common_close"></button>
    </div>
  </dialog>

  <dialog id="image-dialog" aria-labelledby="image-dlg-title">
    <form id="image-form" novalidate>
      <h2 id="image-dlg-title" data-i18n="options_image_dlg_title"></h2>
      <div class="field">
        <label for="image-name" data-i18n="options_dlg_name_label"></label>
        <input id="image-name" name="name" autocomplete="off" maxlength="40">
        <p class="field-error" data-for="name" hidden></p>
      </div>
      <div class="field">
        <label for="image-url" data-i18n="options_dlg_url_label"></label>
        <input id="image-url" name="url" class="mono" autocomplete="off" spellcheck="false"
               data-i18n-attr="placeholder:options_image_url_placeholder">
        <p class="hint" data-i18n="options_image_dlg_hint"></p>
        <p class="field-error" data-for="url" hidden></p>
      </div>
      <p class="field-error" data-for="form" hidden></p>
      <div class="dialog-actions">
        <button type="button" id="image-cancel" class="btn" data-i18n="common_cancel"></button>
        <button type="submit" id="image-save" class="btn btn-primary" data-i18n="common_save"></button>
      </div>
    </form>
  </dialog>

  <dialog id="engine-dialog" aria-labelledby="dlg-title">
    <form id="engine-form" novalidate>
      <h2 id="dlg-title"></h2>
      <div class="field">
        <label for="dlg-name" data-i18n="options_dlg_name_label"></label>
        <input id="dlg-name" name="name" autocomplete="off" maxlength="40"
               data-i18n-attr="placeholder:options_dlg_name_placeholder">
        <p class="field-error" data-for="name" hidden></p>
      </div>
      <div class="field">
        <label for="dlg-url" data-i18n="options_dlg_url_label"></label>
        <input id="dlg-url" name="url" class="mono" autocomplete="off" spellcheck="false"
               aria-describedby="dlg-url-hint dlg-url-status" data-i18n-attr="placeholder:options_dlg_url_placeholder">
        <p id="dlg-url-hint" class="hint" data-i18n="options_dlg_url_hint"></p>
        <p id="dlg-url-status" class="hint"></p>
        <p id="dlg-preset-hint" class="hint" hidden></p>
        <p id="dlg-edit-hint" class="hint" hidden data-i18n="options_dlg_edit_hint"></p>
        <p class="field-error" data-for="url" hidden></p>
      </div>
      <!-- 新增时 id 按名称自动生成，收在“高级”里；编辑时不能改，只读显示在下面一行 -->
      <details id="dlg-advanced" class="disclosure dlg-advanced">
        <summary><span data-i18n="options_dlg_advanced"></span></summary>
        <div class="field">
          <label for="dlg-id" data-i18n="options_dlg_id_label"></label>
          <input id="dlg-id" name="id" class="mono" autocomplete="off" spellcheck="false" maxlength="20"
                 aria-describedby="dlg-id-hint" data-i18n-attr="placeholder:options_dlg_id_placeholder">
          <p id="dlg-id-hint" class="hint" data-i18n="options_dlg_id_hint_add"></p>
          <p class="field-error" data-for="id" hidden></p>
        </div>
      </details>
      <p id="dlg-id-readonly" class="hint" hidden></p>
      <p class="field-error" data-for="form" hidden></p>
      <div class="dialog-actions">
        <!-- 编辑时才有：预置引擎“隐藏”、自定义引擎“删除”；默认组合在用时按钮 aria-disabled，下方写原因（engine-list.js） -->
        <div id="dlg-danger" class="dlg-danger" hidden>
          <button type="button" id="dlg-hide" class="btn" data-i18n="engine_hide" hidden></button>
          <button type="button" id="dlg-delete" class="btn btn-danger" data-i18n="engine_delete" hidden></button>
          <p id="dlg-remove-reason" class="hint" hidden></p>
          <!-- 有关键词规则用到这个引擎时写条数（engine-list.js 的 showDangerZone） -->
          <p id="dlg-rules-hint" class="hint" hidden></p>
          <!-- 删除第一次点击后的提醒（confirmStep 的 onArm 写入、复原时清空）；一直留在无障碍树里，写入时才会被播报 -->
          <p id="dlg-delete-hint" class="hint hint-warn" role="status"></p>
        </div>
        <button type="button" id="dlg-cancel" class="btn" data-i18n="common_cancel"></button>
        <button type="submit" id="dlg-save" class="btn btn-primary" data-i18n="common_save"></button>
      </div>
    </form>
  </dialog>

  <!-- 关键词规则的新增 / 编辑（rules.js 的 setupRuleDialog）。切换单选只切换两个字段的 hidden，两边的值都保留 -->
  <dialog id="rule-dialog" aria-labelledby="rule-dlg-title">
    <form id="rule-form" novalidate>
      <h2 id="rule-dlg-title"></h2>
      <fieldset class="rule-when">
        <legend data-i18n="options_rules_when_legend"></legend>
        <label class="check-row"><input type="radio" id="rule-when-words" name="when" value="words" checked>
          <span data-i18n="options_rules_when_words"></span></label>
        <label class="check-row"><input type="radio" id="rule-when-script" name="when" value="script">
          <span data-i18n="options_rules_when_script"></span></label>
      </fieldset>
      <div id="rule-words-field" class="field">
        <label for="rule-words" data-i18n="options_rules_words_label"></label>
        <input id="rule-words" name="words" type="text" autocomplete="off" spellcheck="false" aria-describedby="rule-words-hint">
        <p id="rule-words-hint" class="hint" data-i18n="options_rules_words_hint"></p>
        <p class="field-error" data-for="words" hidden></p>
      </div>
      <div id="rule-script-field" class="field" hidden>
        <label for="rule-script" data-i18n="options_rules_script_label"></label>
        <select id="rule-script" name="script" aria-describedby="rule-script-hint"></select>
        <p id="rule-script-hint" class="hint" data-i18n="options_rules_script_hint"></p>
        <p class="field-error" data-for="script" hidden></p>
      </div>
      <div class="field">
        <label for="rule-engine" data-i18n="options_rules_engine_label"></label>
        <select id="rule-engine" name="engine"></select>
        <p class="field-error" data-for="engine" hidden></p>
      </div>
      <p class="field-error" data-for="form" hidden></p>
      <div class="dialog-actions">
        <!-- 只在编辑时显示；删除要点两次，第一次点击的提醒写进 #rule-dlg-delete-hint（模态对话框外的 #notices 是 inert） -->
        <div id="rule-dlg-danger" class="dlg-danger" hidden>
          <button type="button" id="rule-dlg-delete" class="btn btn-danger" data-i18n="options_rules_delete" hidden></button>
          <p id="rule-dlg-delete-hint" class="hint hint-warn" role="status"></p>
        </div>
        <button type="button" id="rule-dlg-cancel" class="btn" data-i18n="common_cancel"></button>
        <button type="submit" id="rule-dlg-save" class="btn btn-primary" data-i18n="common_save"></button>
      </div>
    </form>
  </dialog>
</body>
</html>
