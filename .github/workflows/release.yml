# Pushing a v* tag builds the ZIP with `npm run pack` (no key) and publishes a GitHub release
# whose notes are that version's section of CHANGELOG.md on the default branch. Run it by hand to (re)publish an existing tag.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release, e.g. v0.7.0
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build the extension ZIP
        run: |
          if [ -f scripts/pack.mjs ]; then
            node scripts/pack.mjs
          else
            # v0.1.0 and v0.2.0 predate pack.mjs: zip src/ with the key removed, like pack.mjs does.
            stage="$(mktemp -d)"
            cp -r src/. "$stage"
            node -e 'const f=process.argv[1],fs=require("fs"),m=JSON.parse(fs.readFileSync(f));delete m.key;fs.writeFileSync(f,JSON.stringify(m,null,2)+"\n")' "$stage/manifest.json"
            mkdir -p dist
            (cd "$stage" && zip -X -q -r -9 "$GITHUB_WORKSPACE/dist/split-search-${TAG#v}.zip" .)
          fi

      - name: Write release notes from CHANGELOG.md
        run: |
          version="${TAG#v}"
          zip="split-search-${version}.zip"
          # Notes come from the default branch, so older tags get the CHANGELOG as it reads today.
          git show "origin/${{ github.event.repository.default_branch }}:CHANGELOG.md" > changelog.md
          test -f "dist/${zip}"
          {
            echo "**Install:** download \`${zip}\`, unzip it, then in \`chrome://extensions\` turn on Developer mode, click Load unpacked and select the unzipped folder. Or [install from the Chrome Web Store](https://chromewebstore.google.com/detail/Split%20Search/ebefmgpipceocigodihbbbhdiagmjdak)."
            echo
            echo "**安装：**下载 \`${zip}\` 并解压，在 \`chrome://extensions\` 开启开发者模式，点“加载未打包的扩展程序”，选择解压出的文件夹。"
            echo
            awk -v head="## [${version}]" '
              index($0, head) == 1 { found = 1; next }
              found && /^## \[/ { exit }
              found && /^\[[^]]+\]: / { exit }
              found { print }
            ' changelog.md
          } > notes.md
          grep -q '^### ' notes.md

      - name: Publish the release
        run: |
          version="${TAG#v}"
          latest=true
          [ "$TAG" = "$(git tag -l 'v*' --sort=-v:refname | head -1)" ] || latest=false
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "dist/split-search-${version}.zip" --clobber
            gh release edit "$TAG" --title "Split Search ${version}" --notes-file notes.md --latest="$latest"
          else
            gh release create "$TAG" "dist/split-search-${version}.zip" --verify-tag \
              --title "Split Search ${version}" --notes-file notes.md --latest="$latest"
          fi
