<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="asset-size" content="1400x560">
<meta name="asset-out" content="store/marquee-1400x560.png">
<link rel="stylesheet" href="base.css">
<style>
  /* 左栏 80–560：品牌行、两行标题、一行说明，按同一左缘排；右侧真实分屏截图向右、向下出血 */
  .copy { position: absolute; left: 80px; top: 0; bottom: 0; width: 480px; display: flex; flex-direction: column; justify-content: center; }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand .icon { width: 64px; height: 64px; margin: 0 -8px 0 -8px; } /* 图形 48 宽 */
  .brand .name { font-size: 26px; font-weight: 600; letter-spacing: -.005em; }
  h1 { margin-top: 44px; font-size: 56px; line-height: 70px; font-weight: 600; letter-spacing: .01em; }
  p { margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--rule); font-size: 21px; line-height: 32px; color: var(--ink-2); }
  .crop { left: 620px; top: 72px; width: 900px; border-radius: 10px 0 0 0; }
</style></head>
<body>
  <div class="copy">
    <div class="brand"><div class="icon"><img data-icon alt=""></div><div class="name">Split Search</div></div>
    <h1>一次搜索，<br>两个引擎对比</h1>
    <p>Chrome 原生分屏，地址栏或拖拽即用</p>
  </div>
  <!-- 真实截图：左 DuckDuckGo、右 Bing（预置组合），向右、向下出血 -->
  <div class="crop" data-crop="0,0,2400,1500"><img src="../raw/split-ddg-bing-rust.png" data-iw="2400" alt=""></div>
  <script src="crop.js"></script>
</body></html>
