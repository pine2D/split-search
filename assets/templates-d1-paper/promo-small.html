<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="asset-size" content="440x280">
<meta name="asset-out" content="store/small-promo-440x280.png">
<link rel="stylesheet" href="base.css">
<script src="fonts.js"></script>
<style>
  /* 缩到一半（220×140）仍要认得出：只有图标、产品名和一个短标签。
     画面像图标一样分成两格：左格松针绿放图标（CWS 建议小宣传图别大面积留白，左格给它一条清楚的色边），右格纸白放字。 */
  .l { position: absolute; left: 0; top: 0; bottom: 0; width: 176px; background: var(--pine); display: grid; place-items: center; }
  .plate { width: 112px; height: 112px; border-radius: 26px; }
  .plate .icon { width: 120px; height: 120px; } /* 图形 90×72，居中在底板里（base.css .plate） */
  .r { position: absolute; left: 176px; right: 0; top: 0; bottom: 0; display: flex; align-items: center; padding-left: 32px; }
  .name { font-size: 46px; line-height: 44px; font-weight: 700; letter-spacing: -.015em; }
  .tag { margin-top: 18px; font-size: 22px; line-height: 1; font-weight: 600; color: var(--ink-2); }
</style></head>
<body>
  <div class="l"><div class="plate"><div class="icon"><img data-icon alt=""></div></div></div>
  <div class="r"><div><div class="name">Split<br>Search</div><div class="tag">双引擎分屏搜索</div></div></div>
</body></html>
