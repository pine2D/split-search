<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="asset-size" content="1400x560">
<meta name="asset-out" content="store/marquee-1400x560.png">
<link rel="stylesheet" href="base.css">
<style>
  /* 左：品牌、标题、一次键入；右：真实分屏整窗，顶边与品牌行对齐、右留 72px，底边落到画布边缘 */
  .copy { position: absolute; left: 72px; top: 72px; bottom: 72px; width: 420px; display: flex; flex-direction: column; }
  .brand { display: flex; align-items: center; gap: 12px; font-size: 24px; font-weight: 500; color: var(--muted); letter-spacing: .01em; }
  .brand .tile { width: 52px; height: 52px; margin: -8px -6px -8px -6.5px; }
  h1 { margin-top: auto; font-size: 60px; font-weight: 700; line-height: 1.16; letter-spacing: .02em; }
  .keys { margin-top: 36px; align-self: flex-start; font-size: 24px; line-height: 1; padding: 16px 20px; border-radius: 8px;
    background: var(--raised); box-shadow: inset 0 0 0 1px var(--rule); }
  .keys .ret { margin-left: .6em; }
  .crop { left: 547px; top: 72px; width: 781px; border-radius: 8px 8px 0 0; } /* 高 488，正好落到底边 */
</style></head>
<body>
  <div class="copy">
    <div class="brand"><div class="tile"><img data-icon alt=""></div>Split Search</div>
    <h1>一次搜索<br>两个引擎对比</h1>
    <div class="keys">rust programming<span class="caret"></span><span class="ret">↵</span></div>
  </div>
  <!-- 真实截图：左 DuckDuckGo、右 Bing（预置组合），整窗，向下出血 -->
  <div class="crop" data-crop="0,0,2400,1500"><img src="../raw/split-ddg-bing-rust.png" data-iw="2400" alt=""></div>
  <script src="crop.js"></script>
</body></html>
