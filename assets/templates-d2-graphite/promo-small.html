<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="asset-size" content="440x280">
<meta name="asset-out" content="store/small-promo-440x280.png">
<link rel="stylesheet" href="base.css">
<style>
  /* 缩到一半（220×140）仍要认得出：图标、产品名、一句 7 字标语，其他都不放 */
  /* 整组水平居中；图标母版四周有 16/128 的透明边，用负边距按图形本身对齐 */
  body { display: flex; align-items: center; justify-content: center; gap: 24px; padding-bottom: 2px; }
  .tile { width: 136px; height: 136px; margin: 0 -17px; flex: none; }
  .copy { display: flex; flex-direction: column; }
  .name { font-size: 44px; font-weight: 700; line-height: 1; letter-spacing: -.005em; }
  .tag { margin-top: 16px; font-size: 23px; font-weight: 500; line-height: 1; color: var(--muted); letter-spacing: .06em; }
</style></head>
<body>
  <div class="tile"><img data-icon alt=""></div>
  <div class="copy"><div class="name">Split<br>Search</div><div class="tag">双引擎分屏搜索</div></div>
</body></html>
