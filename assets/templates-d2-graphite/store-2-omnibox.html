<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="asset-size" content="1280x800">
<meta name="asset-out" content="store/screenshot-2.png">
<link rel="stylesheet" href="base.css">
<style>
  /* 上：地址栏下拉（0.8 倍）；下：回车后的分屏整窗（0.48 倍，和截图 1、3 同比例） */
  .typed { left: 64px; top: 184px; width: 704px; }
  .main { left: 64px; top: 330px; width: 1152px; border-radius: 8px 8px 0 0; }
  /* 下拉建议那一行右侧：回车 */
  .enter { position: absolute; left: 800px; top: 245px; display: flex; align-items: center; gap: 14px; font-size: 20px; color: var(--muted); }
  .enter .k { font: 500 22px/1 var(--mono); color: var(--ground); background: var(--accent); border-radius: 6px; padding: 7px 11px 6px; }
  .note { right: 64px; top: 121px; }
</style></head>
<body>
  <header class="head">
    <h1>地址栏回车，直接分屏</h1>
    <p>触发网址设为默认搜索，或用快捷字词触发</p>
  </header>
  <div class="note">示例右侧“百度”为自行添加的引擎</div>
  <!-- 真实截图片段：在地址栏输入 rust ownership 时的下拉建议（只取下拉框） -->
  <div class="crop typed" data-crop="236,62,880,141"><img src="../raw/omnibox-suggest.png" data-iw="2400" alt="">
    <i class="mark" data-box="248,134,504,52"></i>
  </div>
  <div class="enter"><span class="k">↵</span>回车后</div>
  <!-- 真实截图：回车后的分屏，左 DuckDuckGo、右百度，查询词 rust ownership，整窗，向下出血 -->
  <div class="crop main" data-crop="0,0,2400,1500"><img src="../raw/omnibox-result-split.png" data-iw="2400" alt=""></div>
  <script src="crop.js"></script>
</body></html>
