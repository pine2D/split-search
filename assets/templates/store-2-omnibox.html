<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="asset-size" content="1280x800">
<meta name="asset-out" content="store/screenshot-2.png">
<link rel="stylesheet" href="base.css">
<style>
  .store-head { height: 140px; }
  /* 上：地址栏下拉（放大 0.8）；下：回车后的分屏整窗（0.5，和截图 1、3 同比例） */
  .typed { left: 288px; top: 146px; width: 704px; outline: 4px solid #fff; z-index: 2; }
  .main { left: 40px; top: 300px; width: 1200px; border-radius: 14px 14px 0 0; }
  .p1 { left: 216px; top: 128px; z-index: 3; } .p2 { left: 64px; top: 282px; z-index: 3; }
  svg.flow { position: absolute; left: 0; top: 0; width: 1280px; height: 800px; z-index: 2; }
</style></head>
<body class="bg-iris">
  <header class="store-head">
    <h1>地址栏照常搜索，回车就分屏</h1>
    <p>触发网址设为默认搜索，或用快捷字词触发</p>
  </header>
  <!-- 真实截图：回车后的分屏，左 DuckDuckGo、右百度，查询词 rust ownership，整窗，向下出血 -->
  <div class="crop main" data-crop="0,0,2400,1500"><img src="../raw/omnibox-result-split.png" data-iw="2400" alt=""></div>
  <!-- 真实截图片段：在地址栏输入 rust ownership 时的下拉建议（只取下拉框，不含下面上一轮的页面） -->
  <div class="crop typed" data-crop="236,62,880,141"><img src="../raw/omnibox-suggest.png" data-iw="2400" alt="">
    <i class="mark" data-box="242,130,512,60"></i>
  </div>
  <svg class="flow" viewBox="0 0 1280 800">
    <defs><marker id="h" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L10 5L0 10z" fill="#fff"/></marker></defs>
    <path d="M640 268 V 292" fill="none" stroke="#fff" stroke-width="5" marker-end="url(#h)"/>
  </svg>
  <div class="pill p1">输入</div>
  <div class="pill p2">回车后</div>
  <div class="chip-note" style="right: 56px; bottom: 16px;">示例右侧“百度”为自行添加的引擎</div>
  <script src="crop.js"></script>
</body></html>
