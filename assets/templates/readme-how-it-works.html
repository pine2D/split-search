<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<!-- README 原理图：地址栏/拖拽 → 触发网址 → 原生分屏，另画一条降级支线。2 倍输出，浅色不透明底（深色主题下也是一张完整卡片）。 -->
<meta name="asset-size" content="880x380@2">
<meta name="asset-out" content="readme/how-it-works.png">
<link rel="stylesheet" href="base.css">
<style>
  body { background: #f6f5ff; }
  .col { position: absolute; top: 26px; }
  .c1 { left: 24px; width: 258px; } .c2 { left: 330px; width: 222px; } .c3 { left: 594px; width: 262px; }
  h2 { font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 8px; height: 28px; }
  h2 b { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--iris); color: #fff; font-size: 15px; }
  .crop { position: relative; width: 100%; margin-top: 12px; border-radius: 8px; box-shadow: 0 1px 2px rgba(20,12,90,.12), 0 8px 22px rgba(20,12,90,.16); }
  .mark { border-width: 2px; border-radius: 6px; box-shadow: none; padding: 3px; box-sizing: content-box; margin: -3px 0 0 -3px; }
  .or { margin-top: 8px; text-align: center; font-size: 13px; color: var(--muted); }
  .note { margin-top: 10px; font-size: 13px; line-height: 1.55; color: var(--muted); }
  .url { margin-top: 12px; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 14px 14px 12px;
    box-shadow: 0 8px 22px rgba(20,12,90,.10); }
  .url code { display: block; font: 600 13px/1.5 var(--mono); white-space: nowrap; color: var(--ink); word-break: break-all; }
  .url code b { color: var(--coral); }
  .url .k { display: block; margin: 2px 0 10px; font-size: 12px; color: var(--muted); border-top: 2px solid var(--line); padding-top: 4px; }
  .url .k.s { border-color: var(--coral); color: #b8441a; margin-bottom: 0; }
  .arrow { position: absolute; top: 112px; width: 48px; white-space: nowrap; text-align: center; font-size: 11px; line-height: 1.3; color: var(--iris-d); font-weight: 600; }
  .arrow svg { display: block; width: 42px; height: 18px; margin: 4px auto 0; }
  .a1 { left: 283px; } .a2 { left: 549px; }
  .fall { position: absolute; left: 330px; right: 24px; top: 300px; display: flex; align-items: center; gap: 12px;
    background: #fff; border: 2px dashed #c9c4f2; border-radius: 12px; padding: 12px 16px; font-size: 14px; line-height: 1.5; }
  .fall b { color: var(--ink); }
  .fall .tag { flex: none; font-size: 12px; font-weight: 700; color: #fff; background: var(--muted); border-radius: 999px; padding: 3px 10px; }
  svg.branch { position: absolute; left: 0; top: 0; width: 880px; height: 380px; }
</style></head>
<body>
  <svg class="branch" viewBox="0 0 880 380">
    <path d="M441 270 V 300" stroke="#9d95e8" stroke-width="2" stroke-dasharray="5 5" fill="none"/>
  </svg>
  <div class="col c1">
    <h2><b>1</b>地址栏输入，或拖到标签栏</h2>
    <!-- 真实截图片段：地址栏下拉建议 -->
    <div class="crop" data-crop="196,56,640,136"><img src="../raw/omnibox-suggest.png" data-iw="2400" alt=""></div>
    <div class="or">或</div>
    <!-- 真实截图片段：选中文字拖到标签栏（尚未松手） -->
    <div class="crop" data-crop="360,0,1280,680"><img src="../raw/drag-to-tabstrip.png" data-iw="2400" alt="">
      <i class="mark" data-box="698,594,170,38"></i><i class="mark" data-box="1424,16,170,28"></i></div>
  </div>
  <div class="arrow a1">Chrome<br>拼出<svg viewBox="0 0 42 18"><path d="M4 9H34M28 3L36 9L28 15" stroke="#4b3fe0" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  <div class="col c2">
    <h2><b>2</b>触发网址</h2>
    <div class="url">
      <code>https://duckduckgo.com<br>/?q=rust+ownership</code>
      <span class="k">左侧引擎的真实搜索网址</span>
      <code><b>&amp;_ss=ddg,baidu</b></code>
      <span class="k s">标记：左 ddg，右 baidu</span>
    </div>
    <p class="note">它是你在 Chrome“网站搜索”里添加的条目，设为默认或用快捷字词触发。</p>
  </div>
  <div class="arrow a2">扩展<br>接管<svg viewBox="0 0 42 18"><path d="M4 9H34M28 3L36 9L28 15" stroke="#4b3fe0" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  <div class="col c3">
    <h2><b>3</b>Chrome 原生分屏</h2>
    <!-- 真实截图：回车后的分屏，左 DuckDuckGo、右百度 -->
    <div class="crop" data-crop="0,0,2400,1500"><img src="../raw/omnibox-result-split.png" data-iw="2400" alt=""></div>
    <p class="note">左侧打开真实搜索，右侧新开一个标签，两者组成分屏；都是普通标签页，登录状态照常。</p>
  </div>
  <div class="fall"><span class="tag">扩展未生效时</span><span>同步到的其他设备、无痕窗口、扩展停用或未授权：这条网址就是<b>一次普通的 DuckDuckGo 搜索</b>，不会出错。</span></div>
  <script src="crop.js"></script>
</body></html>
