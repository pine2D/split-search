<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="asset-size" content="1280x800">
<meta name="asset-out" content="store/screenshot-4-settings.png">
<link rel="stylesheet" href="base.css">
<style>
  .copy { position: absolute; left: 72px; top: 0; bottom: 0; width: 380px; display: flex; flex-direction: column; justify-content: center; }
  .title { font-size: 38px; }
  .sub { font-size: 18px; margin-top: 16px; }
  ul { margin-top: 26px; list-style: none; font-size: 17px; line-height: 1.5; }
  li { position: relative; padding-left: 22px; margin-top: 12px; }
  li::before { content: ""; position: absolute; left: 0; top: .55em; width: 9px; height: 9px; border-radius: 50%; background: var(--brand); }
  /* 设置页整页截图 2378x2876，取内容列 x 620..1800、y 0..1960，缩放 0.6 */
  .shot { left: 500px; top: 48px; width: 708px; height: 800px; }
  .shot > img { position: absolute; width: 1427px; height: 1726px; object-fit: fill; left: -372px; top: -10px; }
  /* 授权框（原图 2400x1500 中约 x 864..1536、y 126..444） */
  .perm { left: 640px; top: 520px; width: 538px; height: 254px; border-radius: 14px; }
  .perm > img { position: absolute; width: 1920px; height: 1200px; object-fit: fill; left: -691px; top: -101px; }
</style></head>
<body>
  <div class="copy">
    <h1 class="title">引擎自己定，<br>权限按需给</h1>
    <p class="sub">在设置页选好左右两个引擎，复制触发网址即可。</p>
    <ul>
      <li>预置 Google、Bing、DuckDuckGo、Perplexity、Kagi，也能添加自定义引擎</li>
      <li>只为你选的搜索引擎网站申请访问权限</li>
      <li>查询词只发给你选的两个引擎</li>
    </ul>
  </div>
  <div class="shot"><img src="../raw/options-fullpage.png" alt=""></div>
  <div class="shot perm"><img src="../raw/permission-prompt.png" alt=""></div>
</body></html>
