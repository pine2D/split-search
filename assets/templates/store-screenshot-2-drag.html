<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="asset-size" content="1280x800">
<meta name="asset-out" content="store/screenshot-2-drag.png">
<link rel="stylesheet" href="base.css">
<style>
  header { position: absolute; left: 0; right: 0; top: 46px; text-align: center; }
  .title { font-size: 40px; }
  .sub { font-size: 19px; margin-top: 12px; }
  /* 原图 2400x1500，取左上 1700x1000 区域，缩放 0.6776 → 1152x678 */
  .shot { left: 64px; top: 172px; width: 1152px; height: 678px; }
  .shot > img { position: absolute; width: 1626px; height: 1016px; object-fit: fill; left: 0; top: 0; }
  svg.note { position: absolute; left: 64px; top: 172px; width: 1152px; height: 678px; overflow: visible; }
  .tag { position: absolute; left: 1010px; top: 236px; background: var(--brand); color: #fff; font-size: 17px; font-weight: 600;
    padding: 7px 14px; border-radius: 999px; box-shadow: 0 6px 18px rgba(26, 115, 232, .35); }
</style></head>
<body>
  <header>
    <h1 class="title">选中文字，拖到标签栏</h1>
    <p class="sub">松手就用两个引擎打开分屏搜索</p>
  </header>
  <div class="shot"><img src="../raw/drag-to-tabstrip.png" alt=""></div>
  <!-- 示意箭头：从选中的文字指向标签栏落点（坐标按 0.6776 缩放后的截图计算） -->
  <svg class="note" viewBox="0 0 1152 678">
    <defs><marker id="h" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#1a73e8"/></marker></defs>
    <path d="M560 400 C 720 330, 900 200, 990 34" fill="none" stroke="#1a73e8" stroke-width="4" stroke-dasharray="10 9"
      stroke-linecap="round" marker-end="url(#h)"/>
  </svg>
  <div class="tag">拖到这里</div>
</body></html>
