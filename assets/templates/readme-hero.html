<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<!-- README 首图：GitHub 正文约 880px 宽，2 倍输出。整张不透明纸底（深浅主题下都是一张完整卡片），只说明“它长什么样”。 -->
<meta name="asset-size" content="880x440@2">
<meta name="asset-out" content="readme/hero.png">
<link rel="stylesheet" href="base.css">
<script src="fonts.js"></script>
<style>
  /* 页头一行：左品牌、右一句话，竖向居中对齐；左缘对齐窗口框 36，右缘对齐窗口框 844。
     截图完整带框，缩放 0.3367，底边切在原图第 903 行（两行之间的空白 892–913）。
     下方两个标签分别对齐左右窗格的内容左缘（原图 x 14 和 1210 → 40.7 和 443.4） */
  .head2 { position: absolute; left: 36px; right: 36px; top: 22px; display: flex; justify-content: space-between; align-items: center; }
  .brand { display: flex; align-items: center; gap: 8px; font-size: 20px; line-height: 32px; font-weight: 600; letter-spacing: -.005em; }
  .brand .icon { width: 40px; height: 40px; margin: -4px -5px; }
  .head2 p { font-size: 15px; line-height: 32px; color: var(--ink-2); }
  .crop { left: 36px; top: 70px; width: 808px; }
  .lab { position: absolute; top: 388px; font-size: 13px; line-height: 16px; color: var(--ink-2); white-space: nowrap; }
  .lab b { font-weight: 600; color: var(--ink); margin-left: 6px; }
  .lab.l { left: 40.7px; } .lab.r { left: 443.4px; }
</style></head>
<body>
  <div class="head2">
    <div class="brand"><div class="icon"><img data-icon alt=""></div>Split Search</div>
    <p data-t="hero.tagline"></p>
  </div>
  <!-- 真实截图：左 DuckDuckGo、右 Bing，查询词 rust programming -->
  <div class="crop" data-crop="0,0,2400,903"><img src="../raw/split-ddg-bing-rust.png" data-iw="2400" alt=""></div>
  <div class="lab l"><span data-t="hero.left"></span><b>DuckDuckGo</b></div><div class="lab r"><span data-t="hero.right"></span><b>Bing</b></div>
  <script src="crop.js"></script>
</body></html>
